  - cookieAuth: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: max_session

  parameters:
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
    CursorParam:
      name: cursor
      in: query
