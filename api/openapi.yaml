openapi: 3.0.3
info:
  title: Max Assistant API
  version: 0.1.0
servers:
  - url: /
paths:
  /api/v1/healthz:
    get:
      operationId: healthz
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/ErrorResp"
        "429":
          $ref: "#/components/responses/ErrorResp"
        "503":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Logged out

  /api/v1/auth/me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Current authenticated owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

  /api/v1/auth/password:
    post:
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password updated
        "400":
          $ref: "#/components/responses/ErrorResp"
        "401":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/threads:
    get:
      operationId: listThreads
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: Paginated threads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadListResponse"
        "400":
          $ref: "#/components/responses/ErrorResp"
    post:
      operationId: createThread
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateThreadRequest"
      responses:
        "201":
          description: Thread created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thread"

  /api/v1/threads/{threadId}:
    get:
      operationId: getThread
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thread snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadSnapshot"
        "404":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/threads/{threadId}/messages:
    get:
      operationId: listMessages
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/LimitParam"
        - name: before
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListResponse"
        "400":
          $ref: "#/components/responses/ErrorResp"
    post:
      operationId: sendMessage
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "202":
          description: Message accepted and agent woken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponse"

  /api/v1/threads/{threadId}/reset:
    post:
      operationId: resetThread
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "204":
          description: Conversation sessions cleared

  /api/v1/runs:
    get:
      operationId: listRuns
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
        - name: agentId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Paginated runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunListResponse"
        "400":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/runs/{runId}:
    get:
      operationId: getRun
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/runs/{runId}/events:
    get:
      operationId: listRunEvents
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: Paginated run events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEventListResponse"
        "400":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/runs/{runId}/cancel:
    post:
      operationId: cancelRun
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRunRequest"
      responses:
        "200":
          description: Run cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"

  /api/v1/runs/{runId}/stream:
    get:
      operationId: streamRun
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Live run text SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/approvals:
    get:
      operationId: listApprovals
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated approvals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalListResponse"
        "400":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/approvals/{approvalId}/decide:
    post:
      operationId: decideApproval
      parameters:
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideApprovalRequest"
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/ErrorResp"
        "409":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/inbox:
    get:
      operationId: listInbox
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
        - name: unreadOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Paginated inbox items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxListResponse"
        "400":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/inbox/{itemId}/read:
    post:
      operationId: markInboxRead
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Marked read

  /api/v1/inbox/{itemId}/answer:
    post:
      operationId: answerOwnerQuestion
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerQuestionRequest"
      responses:
        "200":
          description: Answer recorded and agent woken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItem"

  /api/v1/usage:
    get:
      operationId: getUsage
      parameters:
        - name: days
          in: query
          schema:
            type: integer
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: Daily usage breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        "400":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/quota:
    get:
      operationId: getQuota
      responses:
        "200":
          description: Engine quota windows and learned ceilings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaResponse"
    put:
      operationId: updateQuotaSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuotaSettingsRequest"
      responses:
        "200":
          description: Updated quota settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaResponse"

  /api/v1/status:
    get:
      operationId: getStatus
      responses:
        "200":
          description: Live engine, queue, and dependency status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /api/v1/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: Engine and slot settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
    put:
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "400":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/events:
    get:
      operationId: streamEvents
      parameters:
        - name: topics
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Topic-filtered SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/agents:
    get:
      operationId: listAgents
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
        - name: team
          in: query
          schema:
            type: string
        - name: template
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated agents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentListResponse"
        "400":
          $ref: "#/components/responses/ErrorResp"
    post:
      operationId: createAgentFromTemplate
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetail"
        "400":
          $ref: "#/components/responses/ErrorResp"
        "409":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/agents/bulk:
    post:
      operationId: createAgentsBulk
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentsBulkRequest"
      responses:
        "200":
          description: Bulk instantiation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAgentsBulkResponse"
        "400":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/agents/{agentId}:
    get:
      operationId: getAgent
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetail"
        "404":
          $ref: "#/components/responses/ErrorResp"
    patch:
      operationId: updateAgent
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentRequest"
      responses:
        "200":
          description: Agent updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetail"
        "400":
          $ref: "#/components/responses/ErrorResp"
        "404":
          $ref: "#/components/responses/ErrorResp"
        "409":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/agents/{agentId}/pause:
    post:
      operationId: pauseAgent
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "200":
          description: Agent paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/agents/{agentId}/resume:
    post:
      operationId: resumeAgent
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "200":
          description: Agent resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/agents/{agentId}/wake:
    post:
      operationId: wakeAgent
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WakeAgentRequest"
      responses:
        "202":
          description: Wakeup enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WakeAgentResponse"
        "404":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/agents/{agentId}/runs:
    get:
      operationId: listAgentRuns
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated agent runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunListResponse"
        "400":
          $ref: "#/components/responses/ErrorResp"
        "404":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/agents/{agentId}/notes:
    get:
      operationId: getAgentNotes
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent working notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentNotesResponse"
        "404":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/teams:
    get:
      operationId: listTeams
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: Paginated teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamListResponse"
        "400":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/teams/{teamId}:
    get:
      operationId: getTeam
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Team detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          $ref: "#/components/responses/ErrorResp"
    patch:
      operationId: updateTeam
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamRequest"
      responses:
        "200":
          description: Team updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/ErrorResp"
        "404":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/templates:
    get:
      operationId: listTemplates
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: Role templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateListResponse"
        "400":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/goals:
    get:
      operationId: listGoals
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated goals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalListResponse"
        "400":
          $ref: "#/components/responses/ErrorResp"
    post:
      operationId: createGoal
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalRequest"
      responses:
        "201":
          description: Goal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/tasks:
    get:
      operationId: listTasks
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
        - name: status
          in: query
          schema:
            type: string
        - name: assigneeId
          in: query
          schema:
            type: string
        - name: teamId
          in: query
          schema:
            type: string
        - name: goalId
          in: query
          schema:
            type: string
        - name: rootId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "400":
          $ref: "#/components/responses/ErrorResp"
    post:
      operationId: createTask
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/tasks/{taskId}:
    get:
      operationId: getTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/ErrorResp"
    patch:
      operationId: updateTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/ErrorResp"
        "404":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/tasks/{taskId}/tree:
    get:
      operationId: getTaskTree
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Subtask tree up to 5 levels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTreeNode"
        "404":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/tasks/{taskId}/comments:
    post:
      operationId: commentTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentTaskRequest"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskEvent"
        "400":
          $ref: "#/components/responses/ErrorResp"
        "404":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/tasks/{taskId}/events:
    get:
      operationId: listTaskEvents
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: Paginated task events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskEventListResponse"
        "400":
          $ref: "#/components/responses/ErrorResp"
        "404":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/routines:
    get:
      operationId: listRoutines
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: Paginated routines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineListResponse"
        "400":
          $ref: "#/components/responses/ErrorResp"

  /api/v1/routines/{slug}:
    put:
      operationId: upsertRoutine
      parameters:
        - name: slug
          in: path
          required: true
          schema:
